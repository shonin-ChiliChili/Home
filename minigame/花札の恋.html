<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#cf3f4c">
<title>花札の恋 | 🌶️ Chili²商会</title>
<style>
  :root {
    --red: #d13d4c;
    --red-dark: #923543;
    --rose: #fff0f0;
    --bg: #fff8f4;
    --ink: #47363b;
    --sub: #806c70;
    --line: #efd9d3;
    --board: #fff5e7;
    --shadow: 0 5px 18px #79393c0d;
  }
  * { box-sizing: border-box; }
  html { min-height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  button, select { font: inherit; }
  button { cursor: pointer; touch-action: manipulation; }
  button:focus-visible, select:focus-visible, .card:focus-visible {
    outline: 3px solid #ffbb45;
    outline-offset: 3px;
  }
  .page { max-width: 900px; margin: 0 auto; padding: 0 12px 34px; }
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: linear-gradient(125deg, #fa7772, #ca334c);
    color: white;
    padding: 12px 15px;
    border-radius: 0 0 20px 20px;
    box-shadow: 0 4px 14px #a83d5233;
  }
  .brand { font-size: 19px; font-weight: 900; line-height: 1.35; }
  .brand small {
    display: block;
    font-size: 10px;
    letter-spacing: .06em;
    font-weight: 600;
    opacity: .92;
    margin-top: 2px;
  }
  .pill {
    font-size: 11px;
    font-weight: 750;
    padding: 7px 10px;
    border: 1px solid #ffffff90;
    border-radius: 30px;
    white-space: nowrap;
  }
  .headrow { margin: 16px 2px 12px; }
  h1 { color: var(--red-dark); margin: 0; font-size: clamp(20px, 5.3vw, 24px); line-height: 1.4; }
  .subhead { font-size: 12px; color: var(--sub); line-height: 1.6; margin: 4px 0 0; }
  .main-container { width: 100%; max-width: 690px; margin: 0 auto; }
  .content-card {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 16px;
    box-shadow: var(--shadow);
  }
  .panel-title { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 12px; }
  .panel-title h2 { font-size: 16px; margin: 0; color: var(--red-dark); }
  .panel-label { font-size: 11px; font-weight: 800; color: #bb5260; background: #fff0ef; padding: 5px 9px; border-radius: 99px; }
  .controls { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 9px; align-items: center; margin-bottom: 13px; }
  .control-label { display: block; color: var(--sub); font-size: 11px; font-weight: 700; margin: 0 0 5px; }
  .select-wrap { min-width: 0; }
  select {
    display: block;
    width: 100%;
    min-height: 46px;
    padding: 10px 10px;
    color: var(--ink);
    border: 1px solid #edcfc8;
    border-radius: 11px;
    background: #fffdfb;
    font-size: 13px;
    font-weight: 700;
  }
  .btn-reset {
    align-self: end;
    display: block;
    min-height: 46px;
    padding: 11px 14px;
    background: linear-gradient(120deg, #ef606a, #c93652);
    color: #fff;
    border: 0;
    border-radius: 11px;
    font-size: 13px;
    font-weight: 850;
    white-space: nowrap;
    box-shadow: 0 4px 9px #bc39502f;
  }
  .btn-reset:active, .reset-modal-btn:active, .modal-close:active { transform: scale(.98); }
  .board-shell {
    background: var(--board);
    border: 1px solid #f0d8c8;
    border-radius: 15px;
    padding: clamp(10px, 3vw, 19px);
    min-height: 230px;
  }
  .board { display: grid; gap: clamp(5px, 1.7vw, 9px); width: 100%; margin: 0 auto; }
  .board[data-size="2x3"] { grid-template-columns: repeat(3, minmax(0, 1fr)); max-width: 360px; }
  .board[data-size="3x4"] { grid-template-columns: repeat(4, minmax(0, 1fr)); max-width: 480px; }
  .board[data-size="4x4"] { grid-template-columns: repeat(4, minmax(0, 1fr)); max-width: 480px; }
  .board[data-size="4x5"] { grid-template-columns: repeat(5, minmax(0, 1fr)); max-width: 580px; }
  .card {
    width: 100%;
    aspect-ratio: 2 / 3;
    position: relative;
    cursor: pointer;
    border-radius: 7px;
    box-shadow: 0 2px 5px #74504b21;
    overflow: hidden;
    background: #e8dad2;
    border: 1px solid #dfcabf;
    touch-action: manipulation;
  }
  .card.flipped { border-color: #dc7b83; box-shadow: 0 2px 6px #b847582e; background: white; }
  .card img { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .card .back-img { z-index: 3; object-fit: cover; }
  .card .bg-img { z-index: 1; object-fit: cover; display: none; }
  .card .pattern-img { z-index: 2; object-fit: contain; display: none; transform: scale(.9); }
  .card.flipped .back-img { display: none; }
  .card.flipped .bg-img { display: block; }
  .card.flipped .pattern-img { display: block; }
  @media (hover:hover) and (pointer:fine) {
    .card { transition: transform .15s, box-shadow .15s; }
    .card:hover { transform: translateY(-2px); box-shadow: 0 5px 11px #74504b30; }
    .btn-reset:hover { filter: brightness(1.04); }
  }
  .board-tip {
    margin: 12px 0 0;
    background: #fff5f0;
    border: 1px solid #f5e0d5;
    color: #92616a;
    border-radius: 11px;
    padding: 9px 11px;
    font-size: 12px;
    line-height: 1.6;
    text-align: center;
  }
  .footer { color: #bd9598; text-align: center; font-size: 11px; margin: 15px 0 0; }
  /* 絵柄選択: モーダルの表示切替は元のJavaScriptのまま */
  #selector-modal {
    display: none;
    position: fixed;
    inset: 0;
    background: #2e2229a8;
    z-index: 100;
    justify-content: center;
    align-items: center;
    padding: 14px;
    padding-bottom: max(14px, env(safe-area-inset-bottom));
  }
  .selector-shell {
    display: flex;
    flex-direction: column;
    width: min(430px, 100%);
    max-height: min(85dvh, 720px);
    overflow: hidden;
    border-radius: 19px;
    border: 1px solid #f0d2ce;
    background: #fffdfb;
    box-shadow: 0 15px 50px #4021324b;
  }
  .selector-header {
    flex: 0 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 15px 16px 12px;
    background: linear-gradient(125deg, #fff0ed, #fff9f5);
    border-bottom: 1px solid #f5dfdb;
  }
  .selector-header strong { display:block; font-size: 16px; color: var(--red-dark); }
  .selector-header small { display:block; margin-top: 3px; font-size: 11px; color: var(--sub); }
  .modal-close {
    flex: 0 0 auto;
    border: 1px solid #efcfc9;
    color: var(--red-dark);
    background: #fff;
    border-radius: 10px;
    width: 38px;
    height: 38px;
    font-size: 19px;
    font-weight: 700;
  }
  .selector-content {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 9px;
    padding: 14px;
    overflow-y: auto;
    overscroll-behavior: contain;
    scrollbar-width: thin;
    scrollbar-color: #e8b2b4 transparent;
  }
  .selector-item {
    width: 100%;
    aspect-ratio: 1;
    border: 1px solid #eed8d3;
    border-radius: 10px;
    background: #fff9f6;
    cursor: pointer;
    transition: border-color .15s, background-color .15s;
  }
  .selector-item:active, .selector-item:hover { border-color: var(--red); background: #fff0ef; }
  .selector-item img { width:100%; height:100%; object-fit: contain; display:block; }
  .reset-modal-btn {
    grid-column: 1 / -1;
    margin-top: 4px;
    min-height: 43px;
    border: 1px solid #f1d5d1;
    border-radius: 10px;
    background: #fff0ef;
    color: var(--red-dark);
    font-size: 13px;
    font-weight: 800;
  }
  @media (max-width: 380px) {
    .page { padding: 0 8px 25px; }
    .header { padding: 11px 10px; }
    .brand { font-size: 17px; }
    .pill { font-size: 10px; padding: 7px 8px; }
    .headrow { margin: 12px 2px 10px; }
    .content-card { padding: 10px; }
    .panel-title h2 { font-size: 14px; }
    .controls { gap: 7px; }
    select, .btn-reset { font-size: 11px; padding-left: 8px; padding-right: 8px; }
    .board-shell { padding: 8px; }
    .selector-content { gap: 7px; padding: 10px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .card, .selector-item { transition: none !important; }
  }
</style>
</head>
<body>
<div class="page">
  <header class="header">
    <div class="brand">🌶️ Chili²商会<small>ゲームイベント攻略ツール</small></div>
    <span class="pill">🌸 花札の恋</span>
  </header>

  <div class="headrow">
    <h1>🌸 花札の恋</h1>
    <p class="subhead">札をタップして絵柄を記録。ゲームの進行に合わせて盤面を再現できます。</p>
  </div>

  <main class="main-container">
    <section class="content-card" aria-label="花札の恋 盤面">
      <div class="panel-title">
        <h2>🎴 札の配置</h2>
        <span class="panel-label">タップして選択</span>
      </div>

      <div class="controls">
        <div class="select-wrap">
          <label class="control-label" for="boardSize">ゲームの進行度</label>
          <select id="boardSize" aria-label="盤面の大きさ" onchange="initBoard()">
            <option value="2x3">縦2 × 横3（1〜2ゲーム目）</option>
            <option value="3x4">縦3 × 横4（3〜5ゲーム目）</option>
            <option value="4x4">縦4 × 横4（6〜8ゲーム目）</option>
            <option value="4x5">縦4 × 横5（9〜10ゲーム目）</option>
          </select>
        </div>
        <button type="button" class="btn-reset" onclick="initBoard()">↻ リセット</button>
      </div>

      <div class="board-shell">
        <div id="board" class="board" data-size="2x3"></div>
      </div>
      <p class="board-tip">💡 札をタップ → 絵柄を選択。変更したいときも同じ札をタップしてください。</p>
    </section>
  </main>
  <footer class="footer">🌶️ Chili²商会</footer>
</div>

<!-- 絵柄選択画面：絵柄設定とリセット処理は元のまま -->
<div id="selector-modal" role="dialog" aria-modal="true" aria-label="絵柄を選ぶ">
  <div class="selector-shell">
    <div class="selector-header">
      <div><strong>🌸 絵柄を選ぶ</strong><small>登録したい札の絵柄をタップしてください</small></div>
      <button type="button" class="modal-close" onclick="closeSelector()" aria-label="閉じる">×</button>
    </div>
    <div class="selector-content" id="selector-content"></div>
  </div>
</div>

<script>
    // 使用する柄画像のファイル名リスト
    const patterns = [
        "メイリィ.webp", "絢香.webp", "駅使.webp", "王妃.webp", "花嫁.webp",
        "花嫁の妹.webp", "華道家.webp", "弓術家.webp", "玉京.webp", "古の姫.webp",
        "胡蝶.webp", "語り部.webp", "採詩官.webp", "紫玉.webp", "守真.webp",
        "女魃.webp", "小鹿.webp", "織姫.webp", "精衛.webp", "青蓮.webp",
        "雪山の少女.webp", "船漕ぎ娘.webp", "調馬師.webp", "白姫.webp", "彦星.webp",
        "苗疆聖女.webp", "物作り娘.webp", "捕吏.webp", "妹弟子.webp", "滅鬼師.webp",
        "木工職人.webp", "夜猫娘.webp", "妖狐姫.webp", "嫦娥.webp", "涂山氏.webp"
    ];

    let currentSelectedCard = null;

    // 盤面の初期化
    function initBoard() {
        const board = document.getElementById('board');
        const sizeSelect = document.getElementById('boardSize').value;
        board.setAttribute('data-size', sizeSelect);
        board.innerHTML = ''; // 盤面をクリア

        // 行と列の数を計算
        const [rows, cols] = sizeSelect.split('x').map(Number);
        const totalCards = rows * cols;

        // 札を生成
        for (let i = 0; i < totalCards; i++) {
            const card = document.createElement('div');
            card.className = 'card';
            card.onclick = () => openSelector(card);

            // 1. 背面画像（初期表示）
            const backImg = document.createElement('img');
            backImg.src = '札/札背面.jpg';
            backImg.className = 'back-img';

            // 2. 表面の背景画像
            const bgImg = document.createElement('img');
            bgImg.src = '札/札背景.jpg';
            bgImg.className = 'bg-img';

            // 3. 表面の柄画像（最初は空）
            const patternImg = document.createElement('img');
            patternImg.className = 'pattern-img';

            card.appendChild(backImg);
            card.appendChild(bgImg);
            card.appendChild(patternImg);
            board.appendChild(card);
        }
    }

    // モーダルの準備
    function initSelector() {
        const selectorContent = document.getElementById('selector-content');
        selectorContent.innerHTML = '';

        // 各柄の選択ボタンを作成
        patterns.forEach(pattern => {
            const div = document.createElement('div');
            div.className = 'selector-item';
            div.onclick = () => selectPattern(pattern);
            
            const img = document.createElement('img');
            img.src = `札/${pattern}`;
            div.appendChild(img);
            
            selectorContent.appendChild(div);
        });

        // 「未設定に戻す」ボタンを追加
        const resetBtn = document.createElement('button');
        resetBtn.className = 'reset-modal-btn';
        resetBtn.textContent = '未設定（裏向き）に戻す';
        resetBtn.onclick = () => selectPattern(null);
        selectorContent.appendChild(resetBtn);
    }

    // 札をクリックしたときに選択モーダルを開く
    function openSelector(card) {
        currentSelectedCard = card;
        document.getElementById('selector-modal').style.display = 'flex';
    }

    // 柄を選択して札に適用する
    function selectPattern(patternFileName) {
        if (!currentSelectedCard) return;

        if (patternFileName) {
            const patternImg = currentSelectedCard.querySelector('.pattern-img');
            patternImg.src = `札/${patternFileName}`;
            currentSelectedCard.classList.add('flipped');
        } else {
            currentSelectedCard.querySelector('.pattern-img').src = '';
            currentSelectedCard.classList.remove('flipped');
        }

        closeSelector();
    }

    // モーダルを閉じる
    function closeSelector() {
        document.getElementById('selector-modal').style.display = 'none';
        currentSelectedCard = null;
    }

    // モーダルの背景（薄暗い部分）クリックで閉じる処理
    document.getElementById('selector-modal').addEventListener('click', function(e) {
        if (e.target === this) closeSelector();
    });

    // 初期化実行
    window.onload = () => {
        initSelector();
        initBoard();
    };
</script>
</body>
</html>
