<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ゲームイベント管理ポータル</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ヘッダー -->
  <header class="top-bar">
    <div class="logo">🎮 ギルドイベント戦績</div>
  </header>

  <main class="main-content">
    
    <!-- ▼ ホーム/イベント一覧画面 ▼ -->
    <div id="view-home" class="view-section active">
      <h3 class="section-title">開催イベント一覧</h3>
      <div id="event-list-container">
        <!-- JSでイベントカードが自動挿入されます -->
      </div>
    </div>

    <!-- ▼ イベント詳細画面 ▼ -->
    <div id="view-event-detail" class="view-section">
      <button id="back-to-events-btn" class="btn-secondary" style="margin-bottom: 15px;">← イベント一覧に戻る</button>
      <h3 id="detail-event-title" class="section-title">イベント名</h3>
      <div id="event-history-container">
        <!-- JSで日付ごとの全員の戦績が自動挿入されます -->
      </div>
    </div>

<!-- ▼ ミニゲーム画面 ▼ -->
    <div id="view-minigame" class="view-section">
      <h3 class="section-title">ミニゲーム</h3>
      
      <!-- カード全体をタップで移動可能なリンク構造 -->
      <a href="minigame/牧場点呼.html" class="game-card" style="background-image: url('image/牧場点呼.png');" target="_blank" rel="noopener noreferrer">
        <div class="game-card-content">
          <span class="game-title">牧場点呼</span>
        </div>
      </a>
      <br>
      <a href="minigame/棋士との遭遇.html" class="game-card" style="background-image: url('image/棋士との遭遇.png');" target="_blank" rel="noopener noreferrer">
        <div class="game-card-content">
          <span class="game-title">棋士との遭遇</span>
        </div>
      </a>
      <a href="minigame/牧場点呼.html" class="game-card" style="background-image: url('image/牧場点呼.png');" target="_blank" rel="noopener noreferrer">
        <div class="game-card-content">
          <span class="game-title">牧場点呼</span>
        </div>
      </a>

    </div>

    <!-- ▼ マイページ画面 ▼ -->
    <div id="view-profile" class="view-section">
      <h3 class="section-title">マイページ</h3>

      <!-- 未ログイン状態（ID入力フォーム） -->
      <div id="login-form" class="card text-center">
        <p>プレイヤーID（番号）を入力してください。</p>
        <p class="hint">※テスト用ID: 1001 (田中), 1002 (佐藤)</p>
        <input type="number" id="member-id-input" placeholder="例: 1001" inputmode="numeric">
        <p id="login-error" class="error-msg hidden">該当するIDが見つかりません。</p>
        <button id="login-btn" class="btn-primary" style="width: 100%;">戦績を見る</button>
      </div>

      <!-- ログイン成功後の表示エリア -->
      <div id="user-dashboard" class="hidden">
        <div class="user-header card">
          <div class="user-icon">👤</div>
          <h4 id="user-name">---</h4>
          <p>ID: <span id="user-id-display">----</span></p>
          <button id="logout-btn" class="btn-secondary btn-sm" style="margin-top: 10px;">ID変更</button>
        </div>

        <!-- 表示形式の切り替えタブ -->
        <div class="display-toggle-tabs">
          <button id="tab-timeline" class="toggle-tab active">日付順（時系列）</button>
          <button id="tab-by-event" class="toggle-tab">イベント別</button>
        </div>

        <!-- 時系列表示 -->
        <div id="personal-timeline-view">
          <!-- JSで自動生成 -->
        </div>

        <!-- イベント別表示 -->
        <div id="personal-by-event-view" class="hidden">
          <!-- JSで自動生成 -->
        </div>
      </div>

    </div>

  </main>

  <!-- 下部固定ナビゲーション -->
  <nav class="bottom-nav">
    <a href="#" class="nav-item" data-target="char">
      <span class="nav-icon">🏠</span>
      <span class="nav-label">ホーム</span>
    </a>
    <a href="#" class="nav-item" data-target="minigame">
      <span class="nav-icon">🎮</span>
      <span class="nav-label">ミニゲーム</span>
    </a>
    <a href="#" class="nav-item active" data-target="home">
      <span class="nav-icon">🏆</span>
      <span class="nav-label">イベント</span>
    </a>
    <a href="#" class="nav-item" data-target="profile">
      <span class="nav-icon">👤</span>
      <span class="nav-label">マイページ</span>
    </a>
  </nav>

  <script src="script.js"></script>
</body>
</html>
