
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chili²商会 | コンテンツ</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Helvetica Neue", Arial, sans-serif;
      background: #f5f6fa;
      color: #333;
      line-height: 1.6;
    }

    /* ヘッダー */
    .top-bar {
      background: linear-gradient(135deg, #d62828, #a4161a);
      color: white;
      text-align: center;
      padding: 22px 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.12);
    }

    .logo {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .sub-title {
      font-size: 13px;
      margin-top: 4px;
      opacity: 0.85;
    }

    /* メイン */
    .container {
      max-width: 1050px;
      margin: 0 auto;
      padding: 30px 20px 60px;
    }

    .section {
      margin-bottom: 38px;
    }

    .section-title {
      font-size: 21px;
      font-weight: bold;
      margin: 0 0 18px;
      padding-left: 12px;
      border-left: 5px solid #e63946;
    }

    /* 共通カード */
    a {
      text-decoration: none;
      color: inherit;
    }

    .card {
      display: block;
      position: relative;
      overflow: hidden;
      border-radius: 16px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.09);
      transition: transform 0.25s, box-shadow 0.25s;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 9px 22px rgba(0,0,0,0.16);
    }

    .card:focus-visible {
      outline: 3px solid #e63946;
      outline-offset: 4px;
    }

    /* 服装報酬 */
    .reward-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      min-height: 135px;
      background: linear-gradient(120deg, #fff0e4, #fffaf6);
      border: 1px solid #f5d9c3;
      padding: 25px 30px;
    }

    .reward-left {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .reward-icon {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 75px;
      height: 75px;
      border-radius: 18px;
      background: white;
      font-size: 39px;
      flex-shrink: 0;
    }

    .reward-name {
      font-size: 23px;
      font-weight: bold;
      color: #8e2929;
    }

    .reward-description {
      font-size: 14px;
      color: #777;
      margin-top: 5px;
    }

    .reward-arrow {
      font-size: 26px;
      color: #b93838;
    }

    /* ミニゲーム */
    .game-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 20px;
    }

    .game-card {
      background-color: #353745;
    }

    .game-image {
      height: 185px;
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
      transition: transform 0.3s;
    }

    .game-card:hover .game-image {
      transform: scale(1.04);
    }

    .game-info {
      position: relative;
      background: white;
      text-align: center;
      padding: 17px 10px;
    }

    .game-title {
      font-size: 18px;
      font-weight: bold;
      color: #333;
    }

    .game-hint {
      font-size: 12px;
      color: #999;
      margin-top: 3px;
    }

    /* フッター */
    .footer {
      text-align: center;
      font-size: 12px;
      color: #aaa;
      padding: 10px 0 25px;
    }

    /* スマホ */
    @media (max-width: 650px) {
      .top-bar {
        padding: 18px 12px;
      }

      .logo {
        font-size: 23px;
      }

      .container {
        padding: 24px 15px 35px;
      }

      .section-title {
        font-size: 19px;
      }

      .reward-card {
        padding: 20px;
        min-height: 110px;
      }

      .reward-icon {
        width: 58px;
        height: 58px;
        font-size: 31px;
      }

      .reward-left {
        gap: 13px;
      }

      .reward-name {
        font-size: 19px;
      }

      .reward-description {
        font-size: 12px;
      }

      .game-grid {
        grid-template-columns: 1fr;
        gap: 17px;
      }

      .game-image {
        height: 190px;
      }

      .game-info {
        padding: 13px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .card,
      .game-image {
        transition: none;
      }
    }
  </style>
</head>

<body>

  <!-- ヘッダー -->
  <header class="top-bar">
    <div class="logo">🌶️ Chili²商会</div>
    <div class="sub-title">ゲームコンテンツポータル</div>
  </header>

  <main class="container">
    <!-- ミニゲーム -->
    <section class="section">
      <h2 class="section-title">🎮 ミニゲーム</h2>

      <div class="game-grid">

        <!-- 牧場点呼 -->
        <a
          href="minigame/牧場点呼.html"
          class="card game-card"
          target="_blank"
          rel="noopener noreferrer"
        >
          <div
            class="game-image"
            style="background-image: url('image/牧場点呼.png');"
          ></div>

          <div class="game-info">
            <div class="game-title">🐄 牧場点呼</div>
            <div class="game-hint">タップしてプレイ ❯</div>
          </div>
        </a>

        <!-- 棋士との遭遇 -->
        <a
          href="minigame/棋士との遭遇.html"
          class="card game-card"
          target="_blank"
          rel="noopener noreferrer"
        >
          <div
            class="game-image"
            style="background-image: url('image/棋士との遭遇.png');"
          ></div>

          <div class="game-info">
            <div class="game-title">♟️ 棋士との遭遇</div>
            <div class="game-hint">タップしてプレイ ❯</div>
          </div>
        </a>

        <!-- 花札の恋 -->
        <a
          href="minigame/花札の恋.html"
          class="card game-card"
          target="_blank"
          rel="noopener noreferrer"
        >
          <div
            class="game-image"
            style="background-image: url('image/花札の恋.png');"
          ></div>

          <div class="game-info">
            <div class="game-title">🌸 花札の恋</div>
            <div class="game-hint">タップしてプレイ ❯</div>
          </div>
        </a>

      </div>
    </section>

  </main>

  <footer class="footer">
    Chili²商会
  </footer>

</body>
</html>
