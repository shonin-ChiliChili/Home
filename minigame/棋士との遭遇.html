<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#152438">
<title>棋士との遭遇｜攻略サポート</title>
<style>
  :root {
    --navy:#152438; --navy2:#263b55; --blue:#2166dc; --blue-pale:#e8f1ff;
    --red:#cf3346; --red-pale:#ffeaed; --bg:#f5f7fa; --white:#fff;
    --ink:#172336; --muted:#617085; --border:#e0e6ed; --green:#16845f;
    --line:#b5a991;
    font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    color-scheme:light;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--ink);line-height:1.55}
  button{font:inherit;cursor:pointer;touch-action:manipulation}
  button:focus-visible{outline:3px solid #f0a500;outline-offset:3px}
  button:disabled{cursor:default;opacity:.42}
  [hidden]{display:none!important}
  .topbar{background:var(--navy);color:white;padding:18px max(16px,env(safe-area-inset-left))}
  .top-inner{max-width:1080px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:16px}
  .brand{font-size:clamp(18px,4.4vw,24px);font-weight:850;letter-spacing:.02em}
  .brand small{display:block;font-size:12px;letter-spacing:.04em;font-weight:500;color:#b8c9de;margin-top:2px}
  .help-btn{background:rgba(255,255,255,.11);border:1px solid #60718a;color:white;border-radius:11px;padding:10px 13px;white-space:nowrap;font-weight:700}
  .container{max-width:1080px;margin:0 auto;padding:18px 14px 45px}
  .tutorial{background:#fff;border:2px solid #d3dff4;border-radius:17px;padding:17px 18px;margin-bottom:16px;box-shadow:0 6px 18px #27354a0b}
  .tutorial-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .eyebrow{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--blue)}
  .skip-btn{border:0;background:#ecf0f5;color:#44546a;border-radius:9px;padding:8px 12px;font-weight:750;font-size:13px}
  .progress{display:flex;gap:5px;margin:12px 0 14px}
  .progress span{height:6px;flex:1;background:#e7ecf3;border-radius:5px}
  .progress span.done{background:var(--blue)}
  .tutorial h2{font-size:19px;margin:0 0 7px;line-height:1.4}
  .tutorial p{margin:0;font-size:14px;color:#44546a;line-height:1.8}
  .tutorial .instruction{margin-top:11px;background:#eff5ff;color:#183e7c;border-radius:10px;font-size:14px;padding:11px 13px;font-weight:750}
  .tutorial .finish-btn{width:100%;margin-top:14px}
  .workspace{display:grid;grid-template-areas:"controls" "board";gap:15px;align-items:start}
  .controls{grid-area:controls}.board-panel{grid-area:board}
  @media(min-width:770px){.workspace{grid-template-areas:"board controls";grid-template-columns:minmax(0,1fr) 335px;gap:18px}}
  .panel{background:#fff;border:1px solid var(--border);border-radius:17px;box-shadow:0 4px 18px #18253409;padding:16px}
  .panel-title{margin:0 0 10px;font-size:17px;font-weight:850;display:flex;align-items:center;justify-content:space-between;gap:8px}
  .phase{font-size:12px;font-weight:800;background:#eaf1fb;color:#2159aa;padding:5px 9px;border-radius:99px;white-space:nowrap}
  .hint{font-size:13px;color:var(--muted);margin:0 0 12px}
  .status{background:#f1f5fa;border-radius:12px;padding:11px 12px;font-size:14px;min-height:44px;margin-bottom:14px;font-weight:650;line-height:1.6}
  .status.success{background:#eaf8f1;color:#116b4e}
  .status.warn{background:#fff2e7;color:#9b4a17}
  .tray{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:15px}
  .chip{border:1px solid #d7dce5;border-radius:11px;background:#fffdfa;color:#4e3d26;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:850;font-size:14px}
  .chip .symbol{font-size:22px;line-height:1.2}
  .chip[aria-pressed="true"]{background:var(--blue-pale);border:2px solid var(--blue);color:#174b9c;box-shadow:0 0 0 2px #2166dc21}
  .chip.guide-focus{box-shadow:0 0 0 3px #f0b44f99;animation:pulse 1.6s ease-in-out infinite}
  .actions{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
  .primary{border:0;background:var(--blue);color:white;border-radius:12px;min-height:49px;padding:12px 16px;font-size:15px;font-weight:850}
  .secondary{background:#eff2f6;border:1px solid #e3e7ec;color:#4b5c71;border-radius:12px;min-height:49px;padding:12px 14px;font-size:14px;font-weight:750}
  .primary:not(:disabled):active,.secondary:not(:disabled):active{transform:scale(.985)}
  .primary.guide-focus{box-shadow:0 0 0 4px #f0b44f99;animation:pulse 1.6s infinite}
  .delete-selected{width:100%;margin-top:9px;min-height:40px;font-size:13px;color:#a23040;background:#fff1f2;border-color:#f9d8dd}
  .control-separator{height:1px;background:var(--border);margin:16px 0 13px}
  .meta{display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--muted);font-size:13px}
  .meta strong{font-size:17px;color:var(--ink)}
  .skill{margin-top:12px;border-radius:11px;background:#f1f5fa;padding:11px 12px;font-size:13px;color:#526176}
  .skill.active{background:#fff1d8;color:#8b570f;border:1px solid #f4d195;font-weight:700}
  .tiny-help{margin:13px 0 0;color:var(--muted);font-size:12.5px;line-height:1.65}
  .board-panel{padding:13px}
  .board-top{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap;padding:1px 4px 10px}
  .board-top strong{font-size:16px}
  .board-top small{font-size:12px;color:var(--muted)}
  .legend{display:flex;gap:10px;flex-wrap:wrap;background:#f7f9fc;border-radius:11px;padding:10px 11px;margin:0 0 12px;font-size:12px;font-weight:750}
  .legend span{display:flex;align-items:center;gap:6px}
  .dot{width:11px;height:11px;border-radius:50%;display:inline-block}
  .dot.blue{background:var(--blue)}.dot.red{background:var(--red)}
  .board-frame{max-width:496px;margin:0 auto;background:#f8f1e4;border:2px solid #d8ccb7;border-radius:14px;padding:10px;box-shadow:inset 0 2px 7px #7f705512}
  .board{width:100%;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(9,minmax(0,1fr));aspect-ratio:8/9;isolation:isolate}
  .spot{position:relative;min-width:0;min-height:0;border:none;background:transparent;padding:0;display:grid;place-items:center;color:inherit;z-index:0;touch-action:manipulation}
  .spot::before,.spot::after{content:"";position:absolute;background:var(--line);z-index:-1;pointer-events:none}
  .spot::before{width:1.5px;top:0;bottom:0;left:calc(50% - .75px)}
  .spot::after{height:1.5px;left:0;right:0;top:calc(50% - .75px)}
  .spot.first-row::before{top:50%}.spot.last-row::before{bottom:50%}
  .spot.first-col::after{left:50%}.spot.last-col::after{right:50%}
  .spot-marker{position:absolute;width:73%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;z-index:1;font-weight:900;font-size:17px}
  .safe .spot-marker{background:#2166dc30;border:3px solid var(--blue);color:var(--blue)}
  .danger .spot-marker{background:#cf33462c;border:3px solid var(--red);color:var(--red)}
  .ghost .spot-marker{background:#f2b13d25;border:3px dashed #d69b28;color:#ae7812}
  .piece{position:relative;z-index:2;width:84%;aspect-ratio:1;border-radius:50%;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:0;border:2px solid #c9bfae;background:#fffefa;box-shadow:0 3px 6px #2f292020;font-size:clamp(9px,2.3vw,12px);font-weight:900;line-height:1.13;pointer-events:none}
  .piece .emoji{font-size:clamp(17px,4vw,23px);line-height:1.2}
  .piece.self{background:var(--navy2);color:#fff;border-color:#152438}
  .piece.enemy{color:#503d27}
  .piece.selected{outline:3px solid #efa823;outline-offset:2px}
  .safe .piece.enemy{outline:3px solid var(--blue);outline-offset:1px}
  .danger .piece.enemy{outline:3px solid var(--red);outline-offset:1px}
  .piece.glow{box-shadow:0 0 0 3px #f3b544,0 0 15px 4px #f3bb4e9e}
  .spot.guide-target .spot-marker{box-shadow:0 0 0 4px #f0b44f80;animation:pulse 1.6s infinite}
  .board-note{text-align:center;margin:12px 1px 0;font-size:12.5px;color:var(--muted)}
  .steps{margin:0;padding-left:20px;font-size:13px;color:#59697d;line-height:1.85}
  @keyframes pulse{50%{box-shadow:0 0 0 5px #f0b44f55}}
  @media(max-width:370px){.container{padding:12px 9px 30px}.panel{padding:12px}.board-panel{padding:9px}.board-frame{padding:5px}.tray{gap:6px}.chip{min-height:58px}}
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="topbar">
  <div class="top-inner">
    <div class="brand">♟️ 棋士との遭遇 <small>盤面を再現して、安全な移動先を確認</small></div>
    <button class="help-btn" id="helpBtn" type="button">？ 使い方</button>
  </div>
</header>
<main class="container">
  <section class="tutorial" id="tutorial" aria-label="操作ガイド" hidden>
    <div class="tutorial-top">
      <span class="eyebrow" id="guideCount">はじめての操作ガイド</span>
      <button type="button" class="skip-btn" id="skipGuide">スキップして使う →</button>
    </div>
    <div class="progress" id="guideProgress" aria-hidden="true"></div>
    <h2 id="guideTitle"></h2>
    <p id="guideBody"></p>
    <div class="instruction" id="guideAction"></div>
    <button type="button" class="primary finish-btn" id="finishGuide" hidden>ガイドを終えて、自由に使う</button>
  </section>

  <div class="workspace">
    <section class="panel controls" aria-label="駒と操作">
      <h2 class="panel-title">操作パネル <span class="phase" id="phaseTag">① 敵を配置・編集</span></h2>
      <div id="status" class="status" role="status" aria-live="polite">まずは敵の駒を選び、盤面に置いてください。</div>
      <p class="hint" id="trayHint">配置する敵の駒をタップして選んでください</p>
      <div class="tray" id="tray" role="group" aria-label="敵の駒を選ぶ"></div>
      <div class="actions">
        <button type="button" class="primary" id="confirmBtn">盤面を確定する →</button>
        <button type="button" class="secondary" id="resetBtn">初期化</button>
      </div>
      <button type="button" class="secondary delete-selected" id="deleteSelected" hidden>選択した敵の駒を削除</button>
      <div class="control-separator" id="controlSeparator"></div>
      <div class="meta" id="captureMeta"><span>倒した敵の数</span><strong id="captureCount">0</strong></div>
      <div class="skill" id="skillBadge">👑 将軍を倒すと、次の1手に特別な能力が付きます。</div>
      <p class="tiny-help" id="extraHelp">敵は自動で動きません。自分の駒を動かした後、実際のゲームに合わせて敵の駒を移動・追加してください。</p>
    </section>

    <section class="panel board-panel" aria-label="8列9行の盤面">
      <div class="board-top"><strong>盤面（8 × 9）</strong><small>青い「車」が自分の駒です</small></div>
      <div class="legend" aria-label="色の意味">
        <span><i class="dot blue" aria-hidden="true"></i>青：安全・移動できる</span>
        <span><i class="dot red" aria-hidden="true"></i>赤：危険・移動できない</span>
      </div>
      <div class="board-frame"><div class="board" id="board" role="group" aria-label="駒の配置と移動を行う盤面"></div></div>
      <p class="board-note" id="boardNote">最初は青い「車」だけ。ゲーム画面を見ながら敵の位置を再現します。</p>
    </section>
  </div>
</main>
<script>
(() => {
  'use strict';
  const NX=8, NY=9;
  const TYPES=['卒','士','象','砲','馬','車','将'];
  const SYMBOL={ '卒':'🪖','士':'🧠','象':'🐘','砲':'💣','馬':'🐎','車':'🛺','将':'👑' };
  const TUTORIAL_KEY='chili-chess-guide-seen-v1';
  const $=id=>document.getElementById(id);
  const boardEl=$('board'),trayEl=$('tray'),statusEl=$('status');
  const tutorialEl=$('tutorial'),confirmBtn=$('confirmBtn');

  const initialState=()=>({
    pieces:[{id:1,type:'車',side:'self',x:3,y:5}],
    nextId:2,phase:'edit',selectedType:null,movingEnemy:null,
    captured:0,sweep:false
  });
  let game=initialState();
  let guide={active:!wasGuideSeen(),step:0};
  let statusText='まずは敵の駒を選び、盤面に置いてください。',statusTone='';

  const steps=[
    {title:'① 敵の「卒」を置いてみよう',body:'まず敵の位置を盤面に再現します。駒は何度でも追加できます。',action:'下の「🪖 卒」を選び、盤面の黄色い丸に置いてください。'},
    {title:'② もう1つ、敵の「馬」を配置',body:'複数の敵がいる場合も同じ操作で追加します。「馬」を置くと、危険なマスが生まれます。',action:'「🐎 馬」を選び、黄色い丸に置いてください。'},
    {title:'③ 盤面を確定して色を確認',body:'敵の配置が終わったら盤面を固定します。青は安全に進めるマス、赤は敵に狙われる危険なマスです。',action:'「盤面を確定する」を押してください。'},
    {title:'④ 青いマスへ進んで敵を倒そう',body:'青く囲まれた敵の駒も、その場所に進めば捕獲できます。赤いマスへは移動できません。',action:'縦に進み、青枠の「卒」をタップして捕獲してください。'},
    {title:'⑤ 相手の手を盤面に反映',body:'自分が1手動かしたら、実際のゲームで相手が動かした駒を、この盤面でも動かします。敵を新しく追加することもできます。',action:'盤上の「馬」をタップし、続けて黄色い丸をタップして移動させてください。'},
    {title:'⑥ 敵の「将」を追加',body:'実際のゲームに新しい敵が現れたら、駒一覧から追加します。今回は特別な能力を持つ「将」を置きます。',action:'「👑 将」を選び、黄色い丸に置いてください。'},
    {title:'⑦ もう一度、盤面を確定',body:'敵の変更を反映できたら、次の自分の移動先を調べます。',action:'「盤面を確定する」を押してください。'},
    {title:'⑧ 将軍を倒して能力を獲得',body:'将軍を捕獲すると特別な能力が手に入ります。このツールでは次の1手で障害物を無視し、進む方向の敵をまとめて捕獲できます。',action:'青枠の「将」をタップして捕獲してください。'},
    {title:'ガイド完了！',body:'将軍の能力が有効になりました。ガイドを終えると、盤面と捕獲数を最初の状態に戻します。あとは自由に敵を配置して攻略に使えます。',action:'「ガイドを終えて、自由に使う」を押してください。'}
  ];

  function wasGuideSeen(){try{return localStorage.getItem(TUTORIAL_KEY)==='1'}catch{return false}}
  function markGuideSeen(){try{localStorage.setItem(TUTORIAL_KEY,'1')}catch{}}
  const at=(x,y)=>game.pieces.find(p=>p.x===x&&p.y===y);
  const rook=()=>game.pieces.find(p=>p.side==='self');
  const inBounds=(x,y)=>x>=0&&x<NX&&y>=0&&y<NY;
  const xy=(x,y)=>`${x},${y}`;
  function say(message,tone=''){statusText=message;statusTone=tone}

  function placePiece(type,x,y){
    if(game.phase!=='edit'||!inBounds(x,y)||at(x,y))return false;
    game.pieces.push({id:game.nextId++,type,side:'enemy',x,y});
    say(`敵の「${type}」を配置しました。続けて配置するか、盤面を確定してください。`,'success');
    return true;
  }
  function relocateEnemy(piece,x,y){
    if(game.phase!=='edit'||!piece||piece.side!=='enemy'||at(x,y))return false;
    piece.x=x;piece.y=y;game.movingEnemy=null;
    say('敵の駒を移動しました。盤面を確定すると安全なマスを表示します。','success');
    return true;
  }
  function confirmBoard(){
    if(game.phase!=='edit')return;
    game.phase='play';game.selectedType=null;game.movingEnemy=null;
    say('青＝安全に進める ／ 赤＝敵に狙われるため進めない。青枠の敵をタップすると捕獲できます。');
  }

  // 敵の駒が指定したマスを攻撃できるかを調べる。
  // 8×9の盤面向けに駒の基本的な動きを再現する。
  function straightAndCount(piece,x,y,pieces){
    if(piece.x!==x&&piece.y!==y)return null;
    if(piece.x===x&&piece.y===y)return null;
    const dx=Math.sign(x-piece.x),dy=Math.sign(y-piece.y);
    let cx=piece.x+dx,cy=piece.y+dy,count=0;
    while(cx!==x||cy!==y){if(pieces.some(p=>p.x===cx&&p.y===cy))count++;cx+=dx;cy+=dy}
    return count;
  }
  function attacks(enemy,x,y,pieces){
    const dx=x-enemy.x,dy=y-enemy.y,adx=Math.abs(dx),ady=Math.abs(dy);
    switch(enemy.type){
      case '卒':return (dx===0&&dy===1)||(enemy.y>=4&&adx===1&&dy===0);
      case '士':return adx===1&&ady===1;
      case '象':return adx===2&&ady===2&&!pieces.some(p=>p.x===enemy.x+dx/2&&p.y===enemy.y+dy/2);
      case '馬':{
        if(adx===2&&ady===1)return !pieces.some(p=>p.x===enemy.x+Math.sign(dx)&&p.y===enemy.y);
        if(adx===1&&ady===2)return !pieces.some(p=>p.x===enemy.x&&p.y===enemy.y+Math.sign(dy));
        return false;
      }
      case '車':return straightAndCount(enemy,x,y,pieces)===0;
      case '砲':return straightAndCount(enemy,x,y,pieces)===1;
      case '将':return adx+ady===1;
      default:return false;
    }
  }
  function threatened(x,y,pieces){return pieces.filter(p=>p.side==='enemy').some(p=>attacks(p,x,y,pieces))}

  function moveOptions(){
    const options=new Map(),self=rook();
    if(!self||game.phase!=='play')return options;
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      let x=self.x+dx,y=self.y+dy;
      let crossed=[];
      while(inBounds(x,y)){
        const victim=at(x,y);
        if(victim&&victim.side==='enemy')crossed.push(victim.id);
        // 将軍の能力中は進む経路の敵をまとめて捕獲できる。
        const kills=game.sweep?[...crossed]:victim?[victim.id]:[];
        const newPieces=game.pieces.filter(p=>!kills.includes(p.id)).map(p=>p.id===self.id?{...p,x,y}:p);
        const dangerous=threatened(x,y,newPieces);
        options.set(xy(x,y),{x,y,safe:!dangerous,kills});
        if(victim&&!game.sweep)break;
        x+=dx;y+=dy;
      }
    }
    return options;
  }
  function doMove(x,y){
    if(game.phase!=='play')return false;
    const option=moveOptions().get(xy(x,y));
    if(!option){say('そのマスには移動できません。青い丸か青枠の敵を選んでください。','warn');return false}
    if(!option.safe){say('赤いマスは敵の攻撃範囲です。安全な青いマスを選んでください。','warn');return false}
    const removed=game.pieces.filter(p=>option.kills.includes(p.id));
    const gotGeneral=removed.some(p=>p.type==='将');
    const usedSweep=game.sweep;
    game.pieces=game.pieces.filter(p=>!option.kills.includes(p.id));
    const self=rook();self.x=x;self.y=y;
    game.captured+=removed.length;
    game.sweep=gotGeneral; // 能力を使用した手に新しく将を取った場合は再獲得
    game.phase='edit';game.selectedType=null;game.movingEnemy=null;
    if(gotGeneral){
      say('👑 将軍を捕獲！ 次の1手は障害物を無視し、進む方向の敵をまとめて倒せます。','success');
    }else if(removed.length){
      say(`${removed.length}体捕獲しました！ 相手が動かした駒を移動・追加して、再度盤面を確定してください。`,'success');
    }else if(usedSweep){
      say('特別な能力を使いました。相手の駒を更新して次の手を確認してください。','success');
    }else{
      say('自分の「車」を移動しました。続いて相手の駒を移動・追加してください。','success');
    }
    return true;
  }

  function guideExpected(){
    if(!guide.active)return null;
    switch(guide.step){
      case 0:return {type:'卒',x:3,y:2,mode:'place'};
      case 1:return {type:'馬',x:5,y:4,mode:'place'};
      case 3:return {x:3,y:2,mode:'capture'};
      case 4:return {x:6,y:4,sourceX:5,sourceY:4,mode:'relocate'};
      case 5:return {type:'将',x:3,y:0,mode:'place'};
      case 7:return {x:3,y:0,mode:'capture'};
      default:return null;
    }
  }
  function advanceGuide(){guide.step=Math.min(guide.step+1,steps.length-1);render()}
  function finishGuide(){
    markGuideSeen();guide.active=false;guide.step=0;game=initialState();
    say('準備完了！敵の駒を配置し、盤面を確定してください。');
    render();
  }
  function startGuide(){
    game=initialState();guide.active=true;guide.step=0;
    say('ガイドに沿って操作してみましょう。');render();
    tutorialEl.scrollIntoView({behavior:'smooth',block:'start'});
  }

  function onChip(type){
    if(game.phase!=='edit')return;
    if(guide.active){
      const exp=guideExpected();
      if(!exp||exp.mode!=='place'||exp.type!==type){say('ガイドで指定された駒を選んでください。','warn');renderStatus();return}
    }
    game.selectedType=game.selectedType===type?null:type;
    game.movingEnemy=null;
    say(game.selectedType?`「${type}」を選択中。盤面の空いた交点をタップして置きます。`:'駒の選択を解除しました。');
    render();
  }
  function onSpot(x,y){
    const piece=at(x,y);
    if(guide.active){
      const exp=guideExpected();
      if(!exp){say('上のガイドにあるボタンを押して進めてください。');renderStatus();return}
      if(exp.mode==='place'){
        if(!game.selectedType||game.selectedType!==exp.type){say(`先に駒一覧から「${exp.type}」を選んでください。`,'warn');renderStatus();return}
        if(x===exp.x&&y===exp.y&&placePiece(exp.type,x,y)){
          game.selectedType=null;advanceGuide();
        }else{say('黄色い点線の丸に置いてください。','warn');renderStatus()}
        return;
      }
      if(exp.mode==='capture'){
        if(x===exp.x&&y===exp.y&&doMove(x,y))advanceGuide();
        else{say('青く囲まれたガイド指定の駒をタップしてみましょう。','warn');renderStatus()}
        return;
      }
      if(exp.mode==='relocate'){
        if(!game.movingEnemy){
          if(x===exp.sourceX&&y===exp.sourceY){game.movingEnemy=piece.id;say('馬を選択しました。次は黄色い丸をタップして移動してください。');render()}
          else{say('まず盤上の「馬」をタップしてください。','warn');renderStatus()}
        }else if(x===exp.x&&y===exp.y){
          const moving=game.pieces.find(p=>p.id===game.movingEnemy);
          if(relocateEnemy(moving,x,y))advanceGuide();
        }else{say('黄色い丸をタップして、馬を移動させてください。','warn');renderStatus()}
        return;
      }
    }
    if(game.phase==='play'){
      if(doMove(x,y))render();else renderStatus();
      return;
    }
    if(game.selectedType){
      if(piece?.side==='enemy'){
        game.selectedType=null;game.movingEnemy=piece.id;
        say(`敵の「${piece.type}」を選びました。空いている交点へ移動するか、削除できます。`);render();
      }else if(!piece){placePiece(game.selectedType,x,y);render()}
      else {say('自分の車がある交点には置けません。','warn');renderStatus()}
      return;
    }
    if(game.movingEnemy!==null){
      const moving=game.pieces.find(p=>p.id===game.movingEnemy);
      if(piece?.id===game.movingEnemy){game.movingEnemy=null;say('敵の移動選択を解除しました。');render();return}
      if(!piece){relocateEnemy(moving,x,y);render();return}
      if(piece.side==='enemy'){game.movingEnemy=piece.id;say('別の敵を選びました。空いている交点をタップして移動できます。');render();return}
      say('自分の「車」がある場所には敵を置けません。','warn');renderStatus();return;
    }
    if(piece?.side==='enemy'){
      game.movingEnemy=piece.id;
      say(`敵の「${piece.type}」を選びました。移動先の空いている交点をタップしてください。`);render();
    }else if(piece?.side==='self'){
      say('青い「車」は盤面確定後に動かせます。先に敵を配置してください。');renderStatus();
    }else{
      say('先に上の駒一覧から置きたい敵を選んでください。');renderStatus();
    }
  }

  function renderTray(){
    trayEl.replaceChildren();
    const exp=guideExpected();
    for(const type of TYPES){
      const btn=document.createElement('button');
      btn.type='button';btn.className='chip';btn.setAttribute('aria-pressed',String(game.selectedType===type));
      const allowed=!guide.active||(exp?.mode==='place'&&exp.type===type);
      btn.disabled=game.phase!=='edit'||!allowed;
      if(guide.active&&exp?.mode==='place'&&exp.type===type)btn.classList.add('guide-focus');
      const symbol=document.createElement('span');symbol.className='symbol';symbol.textContent=SYMBOL[type];
      const name=document.createElement('span');name.textContent=type;
      btn.append(symbol,name);btn.addEventListener('click',()=>onChip(type));trayEl.appendChild(btn);
    }
  }
  function renderBoard(){
    const opts=moveOptions(),exp=guideExpected();
    boardEl.replaceChildren();
    for(let y=0;y<NY;y++)for(let x=0;x<NX;x++){
      const spot=document.createElement('button');spot.type='button';spot.className='spot';
      spot.dataset.xy=xy(x,y);
      if(!y)spot.classList.add('first-row');if(y===NY-1)spot.classList.add('last-row');
      if(!x)spot.classList.add('first-col');if(x===NX-1)spot.classList.add('last-col');
      const piece=at(x,y),option=opts.get(xy(x,y));
      if(option)spot.classList.add(option.safe?'safe':'danger');
      const target=guide.active&&exp&&(
        (exp.mode==='place'&&exp.x===x&&exp.y===y)||
        (exp.mode==='capture'&&exp.x===x&&exp.y===y)||
        (exp.mode==='relocate'&&(game.movingEnemy===null?(x===exp.sourceX&&y===exp.sourceY):(x===exp.x&&y===exp.y)))
      );
      if(target)spot.classList.add('guide-target');
      if(option||target){
        const marker=document.createElement('span');marker.className='spot-marker';
        if(target&&!option)spot.classList.add('ghost');
        if(!piece)marker.textContent=option?(option.safe?'•':'×'):(target?'＋':'');
        spot.appendChild(marker);
      }
      if(piece){
        const chip=document.createElement('span');chip.className='piece '+(piece.side==='self'?'self':'enemy');
        if(game.movingEnemy===piece.id)chip.classList.add('selected');
        if(game.sweep&&piece.side==='self')chip.classList.add('glow');
        const emoji=document.createElement('span');emoji.className='emoji';emoji.textContent=SYMBOL[piece.type];
        const label=document.createElement('span');label.textContent=piece.type;
        chip.append(emoji,label);spot.appendChild(chip);
      }
      const route=option?(option.safe?'、移動可能':'、危険・移動不可'):'';
      spot.setAttribute('aria-label',`左から${x+1}列目、上から${y+1}行目${piece?'、'+(piece.side==='self'?'自分':'敵')+'の'+piece.type:''}${route}${target?'、ガイドの指定位置':''}`);
      spot.addEventListener('click',()=>onSpot(x,y));boardEl.appendChild(spot);
    }
  }
  function renderStatus(){statusEl.textContent=statusText;statusEl.className='status'+(statusTone?' '+statusTone:'')}
  function renderGuide(){
    tutorialEl.hidden=!guide.active;
    if(!guide.active)return;
    const step=steps[guide.step];
    $('guideCount').textContent=guide.step===steps.length-1?'操作ガイド・完了':`操作ガイド ${guide.step+1} / ${steps.length-1}`;
    $('guideTitle').textContent=step.title;$('guideBody').textContent=step.body;
    $('guideAction').textContent=step.action;
    $('guideProgress').replaceChildren();
    for(let i=0;i<steps.length-1;i++){
      const bar=document.createElement('span');if(i<=guide.step)bar.classList.add('done');
      $('guideProgress').appendChild(bar);
    }
    $('finishGuide').hidden=guide.step!==steps.length-1;
    $('skipGuide').hidden=guide.step===steps.length-1;
  }
  function render(){
    renderGuide();renderStatus();renderTray();renderBoard();
    $('phaseTag').textContent=game.phase==='edit'?'① 敵を配置・編集':'② 自分の駒を移動';
    $('trayHint').textContent='置く駒を選ぶ／盤上の敵をタップして移動';
    $('trayHint').hidden=game.phase==='play';
    trayEl.hidden=game.phase==='play';
    confirmBtn.hidden=game.phase==='play';
    confirmBtn.disabled=guide.active&&![2,6].includes(guide.step);
    confirmBtn.classList.toggle('guide-focus',guide.active&&[2,6].includes(guide.step));
    $('resetBtn').disabled=guide.active;
    $('deleteSelected').hidden=guide.active||game.phase!=='edit'||game.movingEnemy===null;
    $('captureCount').textContent=String(game.captured);
    $('controlSeparator').hidden=guide.active;
    $('captureMeta').hidden=guide.active;
    $('extraHelp').hidden=guide.active;
    const skill=$('skillBadge');skill.hidden=guide.active&&guide.step<8;skill.classList.toggle('active',game.sweep);
    skill.textContent=game.sweep?'✨ 将軍の能力が発動待ち！ 次の1手は駒を飛び越え、進路上の敵をまとめて捕獲できます。':'👑 将軍を倒すと、次の1手に特別な能力が付きます。';
    $('boardNote').textContent=game.phase==='edit'?'駒を選んで交点へ配置。敵をタップすると位置を変更できます。':game.sweep?'特別な能力が有効です。青いマスを選んで移動してください。':'青い丸＝移動可／青枠の敵＝捕獲可／赤い丸＝危険';
  }
  confirmBtn.addEventListener('click',()=>{
    if(guide.active&&![2,6].includes(guide.step))return;
    confirmBoard();if(guide.active)advanceGuide();else render();
  });
  $('deleteSelected').addEventListener('click',()=>{
    if(guide.active||game.phase!=='edit'||game.movingEnemy===null)return;
    game.pieces=game.pieces.filter(p=>p.id!==game.movingEnemy);
    game.movingEnemy=null;say('選択した敵を盤面から削除しました。','success');render();
  });
  $('resetBtn').addEventListener('click',()=>{
    if(guide.active)return;
    if(game.pieces.length>1||game.captured||game.phase==='play'||game.sweep){
      if(!window.confirm('すべての駒の配置と捕獲数を初期状態に戻しますか？'))return;
    }
    game=initialState();say('初期状態に戻しました。敵の駒を配置してください。');render();
  });
  $('skipGuide').addEventListener('click',finishGuide);
  $('finishGuide').addEventListener('click',finishGuide);
  $('helpBtn').addEventListener('click',()=>{
    if(guide.active){tutorialEl.scrollIntoView({behavior:'smooth',block:'start'});return}
    if(game.pieces.length>1||game.phase==='play'||game.captured||game.sweep){
      if(!window.confirm('ガイドを開始すると現在の盤面は初期化されます。開始しますか？'))return;
    }
    startGuide();
  });
  render();
})();
</script>
</body>
</html>
